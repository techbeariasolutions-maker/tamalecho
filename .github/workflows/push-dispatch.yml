name: push-dispatch

# Web Push desde GitHub Actions (D-21).
# - Programado (HT-07.2-A): cada 30 min, a los minutos 07 y 37 (fuera de la hora en punto, cuando
#   GitHub Actions tiene más demora). Cada corrida envía a cada suscripción, a lo sumo, la ventana
#   vigente de su hora local, una sola vez (clave idempotente en el servidor).
# - Manual: GitHub → Actions → push-dispatch → Run workflow. Modo «test» (por defecto) envía el consejo
#   destacado a todas las suscripciones fuera de silencio; modo «scheduled» hace lo mismo que el job.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'test = envío de prueba a todos (fuera de silencio) · scheduled = igual que el job programado'
        type: choice
        options:
          - test
          - scheduled
        default: test

permissions:
  contents: read

# Nunca dos corridas a la vez: la segunda espera a que termine la primera.
concurrency:
  group: push-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Apunta a producción: las vistas previas están protegidas y Actions no puede llamarlas (D-21).
      - name: Call the production dispatch endpoint
        env:
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          MODE: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.mode }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            --request POST \
            --header "Authorization: Bearer $DISPATCH_SECRET" \
            "https://tamalecho.vercel.app/api/push/dispatch?mode=${MODE}"
